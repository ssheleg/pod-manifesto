achable surface</text><path class="edge" d="M82.0 221.0 H112.0" marker-end="url(#a)"/><path class="edge" d="M195.0 221.0 H225.0" marker-end="url(#a)"/><path class="edge" d="M387.0 221.0 H417.0" marker-end="url(#a)"/><rect class="band" x="0.0" y="358.0" width="960.0" height="100.0" rx="12"/><text class="band-label" x="2.0" y="349.0">EVIDENCE</text><rect class="node" x="18.0" y="370.0" width="170.0" height="34.0" rx="8"/><text class="label" x="103.0" y="387.0">Implementation check</text><rect class="node" x="232.0" y="370.0" width="134.0" height="34.0" rx="8"/><text class="label" x="299.0" y="387.0">Observed result</text><rect class="node" x="410.0" y="370.0" width="163.0" height="34.0" rx="8"/><text class="label" x="491.5" y="387.0">Delivery acceptance</text><path class="edge" d="M197.0 387.0 H227.0" marker-end="url(#a)"/><path class="edge" d="M375.0 387.0 H405.0" marker-end="url(#a)"/><rect class="node" x="560.0" y="414.0" width="163.0" height="34.0" rx="8"/><text class="label" x="641.5" y="431.0">Outcome observation</text><rect class="node" x="767.0" y="414.0" width="141.0" height="34.0" rx="8"/><text class="label" x="837.5" y="431.0">Product learning</text><path class="edge" d="M732.0 431.0 H762.0" marker-end="url(#a)"/><path class="edge edge--dash" d="M332.5 87.0 V114.0 H33.5 V201.0" marker-end="url(#a)"/><text class="edge-label" x="344.5" y="106.0" text-anchor="start">assigned to</text><path class="edge edge--dash" d="M671.0 87.0 V148.0 H57.5 V201.0" marker-end="url(#a)"/><text class="edge-label" x="683.0" y="140.0" text-anchor="start">constrains</text><path class="edge edge--dash" d="M103.0 355.0 V284.0 H139.5 V241.0" marker-end="url(#a)"/><text class="edge-label" x="115.0" y="276.0" text-anchor="start">observes</text><path class="edge edge--dash" d="M641.5 410.0 V320.0 H508.0 V241.0" marker-end="url(#a)"/><text class="edge-label" x="653.5" y="312.0" text-anchor="start">observes</text><text class="edge-label edge-label--foot" x="18.0" y="488.0" text-anchor="sta