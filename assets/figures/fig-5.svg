<svg class="figsvg" viewBox="0 0 780 400" role="img" aria-label="The learning loop: a lesson becomes a mechanism, then retires" xmlns="http://www.w3.org/2000/svg"><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6.2" refY="3.5" orient="auto"><path class="head" d="M0 0 L7 3.5 L0 7 z"/></marker></defs><rect class="node" x="20.0" y="30.0" width="48.0" height="34.0" rx="8"/><text class="label" x="44.0" y="47.0">Run</text><rect class="node" x="108.0" y="30.0" width="163.0" height="34.0" rx="8"/><text class="label" x="189.5" y="47.0">Observed divergence</text><rect class="node" x="311.0" y="30.0" width="220.0" height="34.0" rx="8"/><text class="label" x="421.0" y="47.0">Owning layer and root cause</text><path class="edge" d="M77.0 47.0 H103.0" marker-end="url(#a)"/><path class="edge" d="M280.0 47.0 H306.0" marker-end="url(#a)"/><rect class="node node--em" x="20.0" y="130.0" width="380.0" height="34.0" rx="8"/><text class="label label--em" x="210.0" y="147.0">Mechanical check, bounded rule, or expiring note</text><path class="edge" d="M421.0 64.0 V100.0 H210.0 V125.0" marker-end="url(#a)"/><rect class="node" x="460.0" y="130.0" width="150.0" height="34.0" rx="8"/><text class="label" x="535.0" y="147.0">Next run</text><path class="edge" d="M409.0 147.0 H455.0" marker-end="url(#a)"/><rect class="node node--em" x="20.0" y="230.0" width="380.0" height="34.0" rx="8"/><text class="label label--em" x="210.0" y="247.0">Did the mechanism fire?</text><path class="edge" d="M535.0 164.0 V200.0 H210.0 V225.0" marker-end="url(#a)"/><rect class="node node--ok" x="460.0" y="205.0" width="240.0" height="34.0" rx="8"/><text class="label" x="580.0" y="222.0">Keep and measure</text><rect class="node node--bad" x="460.0" y="285.0" width="240.0" height="34.0" rx="8"/><text class="label" x="580.0" y="302.0">Retire, preserve history</text><path class="edge" d="M409 247 H430"/><path class="edge" d="M430 222 V302"/><path class="edge" d="M430.0 222.0 H455.0" marker-end="url(#a)"/><path class="edge" d="M430.0 302.0 H455.0" marker-end="url(#a)"/><text class="edge-label" x="422.0" y="226.0" text-anchor="end">yes</text><text class="edge-label" x="460.0" y="340.0" text-anchor="start">surface gone or rule cold</text><path class="edge edge--dash" d="M704 222 H764 V370 H44.0 V68" marker-end="url(#a)"/><path class="edge edge--dash" d="M704 302 H764"/><text class="edge-label edge-label--foot" x="20.0" y="388.0" text-anchor="start">every run re-enters with whatever the last one made mechanical</text></svg>
