<svg class="figsvg" viewBox="0 0 880 516" role="img" aria-label="The learning loop: a lesson becomes a mechanism, then retires" xmlns="http://www.w3.org/2000/svg"><defs><marker id="h" markerWidth="6" markerHeight="6" refX="5.2" refY="3" orient="auto"><path class="head" d="M0 0 L6 3 L0 6 z"/></marker></defs><text class="lane" x="0.0" y="32.0" text-anchor="start">THE LOOP</text><text class="lane" x="880.0" y="32.0" text-anchor="end">AND THE RETURN THAT CLOSES IT</text><path class="rule" d="M44.0 60.0 V316.0"/><path class="rule rule--faint" d="M0.0 54.0 H880.0"/><text class="idx" x="0.0" y="80.0">01</text><circle class="dot" cx="44.0" cy="76.0" r="3.4"/><text class="name" x="62.0" y="81.0" text-anchor="start">Run</text><path class="rule rule--faint" d="M0.0 102.0 H880.0"/><text class="idx" x="0.0" y="128.0">02</text><circle class="dot" cx="44.0" cy="124.0" r="3.4"/><text class="name" x="62.0" y="129.0" text-anchor="start">Observed divergence</text><text class="note" x="880.0" y="128.0" text-anchor="end">what diverged from the operating contract</text><path class="rule rule--faint" d="M0.0 150.0 H880.0"/><text class="idx" x="0.0" y="176.0">03</text><circle class="dot" cx="44.0" cy="172.0" r="3.4"/><text class="name" x="62.0" y="177.0" text-anchor="start">Owning layer and root cause</text><text class="note" x="880.0" y="176.0" text-anchor="end">which earlier layer let it through</text><path class="rule rule--faint" d="M0.0 198.0 H880.0"/><text class="idx" x="0.0" y="224.0">04</text><circle class="dot--key" cx="44.0" cy="220.0" r="3.4"/><text class="name name--key" x="62.0" y="225.0" text-anchor="start">Mechanical check, bounded rule, or expiring note</text><text class="note" x="880.0" y="224.0" text-anchor="end">the three grades of learning</text><path class="rule rule--faint" d="M0.0 246.0 H880.0"/><text class="idx" x="0.0" y="272.0">05</text><circle class="dot" cx="44.0" cy="268.0" r="3.4"/><text class="name" x="62.0" y="273.0" text-anchor="start">Next run</text><text class="note" x="880.0" y="272.0" text-anchor="end">the lesson is now in the system, not in a memory</text><path class="rule rule--faint" d="M0.0 294.0 H880.0"/><text class="idx" x="0.0" y="320.0">06</text><circle class="dot--key" cx="44.0" cy="316.0" r="3.4"/><text class="name name--key" x="62.0" y="321.0" text-anchor="start">Did the mechanism fire?</text><path class="rule" d="M104.0 324.0 V412.0"/><path class="flow" d="M44.0 324.0 V340.0 H104.0"/><path class="rule rule--faint" d="M0.0 342.0 H880.0"/><path class="flow" d="M104.0 364.0 H118.0" marker-end="url(#h)"/><circle class="dot--ok" cx="126.0" cy="364.0" r="3.4"/><text class="name" x="142.0" y="369.0" text-anchor="start">Keep and measure</text><text class="tag tag--ok" x="839.2" y="368.0">[KEPT]</text><text class="note" x="823.2" y="368.0" text-anchor="end">the mechanism fired</text><path class="rule rule--faint" d="M0.0 390.0 H880.0"/><path class="flow" d="M104.0 412.0 H118.0" marker-end="url(#h)"/><circle class="dot--bad" cx="126.0" cy="412.0" r="3.4"/><text class="name" x="142.0" y="417.0" text-anchor="start">Retire, preserve history</text><text class="tag tag--bad" x="818.8" y="416.0">[RETIRED]</text><text class="note" x="802.8" y="416.0" text-anchor="end">surface gone or rule cold</text><path class="flow flow--dash" d="M104.0 420.0 V448.0 H22 V40.0 H44.0 V58.0" marker-end="url(#h)"/><text class="note note--foot" x="126.0" y="474.0" text-anchor="start">every run re-enters with whatever the last one made mechanical</text></svg>
