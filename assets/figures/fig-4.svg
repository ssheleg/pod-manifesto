<svg class="figsvg" viewBox="0 0 720 668" role="img" aria-label="The seam walk from requirement to acceptance" xmlns="http://www.w3.org/2000/svg"><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6.2" refY="3.5" orient="auto"><path class="head" d="M0 0 L7 3.5 L0 7 z"/></marker></defs><rect class="node" x="20.0" y="10.0" width="330.0" height="34.0" rx="8"/><text class="label" x="185.0" y="27.0">Requirement with an observable</text><path class="edge" d="M185.0 48 V77" marker-end="url(#a)"/><text class="edge-label" x="199.0" y="71.0" text-anchor="start">did it rest on a decision somebody actually made?</text><rect class="node" x="20.0" y="82.0" width="330.0" height="34.0" rx="8"/><text class="label" x="185.0" y="99.0">Recorded decision</text><path class="edge" d="M185.0 120 V149" marker-end="url(#a)"/><text class="edge-label" x="199.0" y="143.0" text-anchor="start">did the decision reach the specification?</text><rect class="node" x="20.0" y="154.0" width="330.0" height="34.0" rx="8"/><text class="label" x="185.0" y="171.0">Design or specification</text><path class="edge" d="M185.0 192 V221" marker-end="url(#a)"/><text class="edge-label" x="199.0" y="215.0" text-anchor="start">did it define a contract and its failure behaviour?</text><rect class="node" x="20.0" y="226.0" width="330.0" height="34.0" rx="8"/><text class="label" x="185.0" y="243.0">Contract and failure behaviour</text><path class="edge" d="M185.0 264 V293" marker-end="url(#a)"/><text class="edge-label" x="199.0" y="287.0" text-anchor="start">did a task build that contract?</text><rect class="node" x="20.0" y="298.0" width="330.0" height="34.0" rx="8"/><text class="label" x="185.0" y="315.0">Task with a satisfiable definition of done</text><path class="edge" d="M185.0 336 V365" marker-end="url(#a)"/><text class="edge-label" x="199.0" y="359.0" text-anchor="start">did the change satisfy the task as written?</text><rect class="node" x="20.0" y="370.0" width="330.0" height="34.0" rx="8"/><text class="label" x="185.0" y="387.0">Change in the tree</text><path class="edge" d="M185.0 408 V437" marker-end="url(#a)"/><text class="edge-label" x="199.0" y="431.0" text-anchor="start">did an executed check observe the changed behaviour?</text><rect class="node" x="20.0" y="442.0" width="330.0" height="34.0" rx="8"/><text class="label" x="185.0" y="459.0">Executed check</text><path class="edge" d="M185.0 480 V509" marker-end="url(#a)"/><text class="edge-label" x="199.0" y="503.0" text-anchor="start">can you or a downstream system reach it?</text><rect class="node" x="20.0" y="514.0" width="330.0" height="34.0" rx="8"/><text class="label" x="185.0" y="531.0">Reachable user or system surface</text><path class="edge" d="M185.0 552 V581" marker-end="url(#a)"/><text class="edge-label" x="199.0" y="575.0" text-anchor="start">does it satisfy the ORIGINAL requirement?</text><rect class="node node--ok" x="20.0" y="586.0" width="330.0" height="34.0" rx="8"/><text class="label" x="185.0" y="603.0">Acceptance</text></svg>
