<svg class="figsvg" viewBox="0 0 880 518" role="img" aria-label="The seam walk, from requirement to acceptance" xmlns="http://www.w3.org/2000/svg"><defs><marker id="h" markerWidth="6" markerHeight="6" refX="5.2" refY="3" orient="auto"><path class="head" d="M0 0 L6 3 L0 6 z"/></marker></defs><text class="lane" x="0.0" y="30.0" text-anchor="start">THE WALK</text><text class="lane" x="880.0" y="30.0" text-anchor="end">EACH RUNG NAMES WHAT SHOULD EXIST NEXT</text><path class="rule" d="M58.0 44.0 V474.0"/><path class="rule rule--faint" d="M0.0 34.0 H880.0"/><text class="idx" x="0.0" y="62.0">01</text><circle class="dot" cx="58.0" cy="58.0" r="3.4"/><text class="name" x="76.0" y="63.0" text-anchor="start">Requirement with an observable</text><text class="note" x="880.0" y="62.0" text-anchor="end">did it rest on a decision somebody actually made?</text><path class="rule rule--faint" d="M0.0 86.0 H880.0"/><text class="idx" x="0.0" y="114.0">02</text><circle class="dot" cx="58.0" cy="110.0" r="3.4"/><text class="name" x="76.0" y="115.0" text-anchor="start">Recorded decision</text><text class="note" x="880.0" y="114.0" text-anchor="end">did the decision reach the specification?</text><path class="rule rule--faint" d="M0.0 138.0 H880.0"/><text class="idx" x="0.0" y="166.0">03</text><circle class="dot" cx="58.0" cy="162.0" r="3.4"/><text class="name" x="76.0" y="167.0" text-anchor="start">Design or specification</text><text class="note" x="880.0" y="166.0" text-anchor="end">did it define a contract and its failure behaviour?</text><path class="rule rule--faint" d="M0.0 190.0 H880.0"/><text class="idx" x="0.0" y="218.0">04</text><circle class="dot" cx="58.0" cy="214.0" r="3.4"/><text class="name" x="76.0" y="219.0" text-anchor="start">Contract and failure behaviour</text><text class="note" x="880.0" y="218.0" text-anchor="end">did a task build that contract?</text><path class="rule rule--faint" d="M0.0 242.0 H880.0"/><text class="idx" x="0.0" y="270.0">05</text><circle class="dot" cx="58.0" cy="266.0" r="3.4"/><text class="name" x="76.0" y="271.0" text-anchor="start">Task with a satisfiable definition of done</text><text class="note" x="880.0" y="270.0" text-anchor="end">did the change satisfy the task as written?</text><path class="rule rule--faint" d="M0.0 294.0 H880.0"/><text class="idx" x="0.0" y="322.0">06</text><circle class="dot" cx="58.0" cy="318.0" r="3.4"/><text class="name" x="76.0" y="323.0" text-anchor="start">Change in the tree</text><text class="note" x="880.0" y="322.0" text-anchor="end">did an executed check observe the changed behaviour?</text><path class="rule rule--faint" d="M0.0 346.0 H880.0"/><text class="idx" x="0.0" y="374.0">07</text><circle class="dot" cx="58.0" cy="370.0" r="3.4"/><text class="name" x="76.0" y="375.0" text-anchor="start">Executed check</text><text class="note" x="880.0" y="374.0" text-anchor="end">can you or a downstream system reach it?</text><path class="rule rule--faint" d="M0.0 398.0 H880.0"/><text class="idx" x="0.0" y="426.0">08</text><circle class="dot" cx="58.0" cy="422.0" r="3.4"/><text class="name" x="76.0" y="427.0" text-anchor="start">Reachable user or system surface</text><text class="note" x="880.0" y="426.0" text-anchor="end">does it satisfy the ORIGINAL requirement?</text><path class="rule rule--faint" d="M0.0 450.0 H880.0"/><text class="idx" x="0.0" y="478.0">09</text><circle class="dot--ok" cx="58.0" cy="474.0" r="3.4"/><text class="name name--key" x="76.0" y="479.0" text-anchor="start">Acceptance</text><text class="tag tag--ok" x="812.0" y="478.0">[ACCEPTED]</text></svg>
