<svg class="figsvg" viewBox="0 0 880 330" role="img" aria-label="A checker stands between fan-out and convergence" xmlns="http://www.w3.org/2000/svg"><defs><marker id="h" markerWidth="6" markerHeight="6" refX="5.2" refY="3" orient="auto"><path class="head" d="M0 0 L6 3 L0 6 z"/></marker></defs><text class="lane" x="0.0" y="34.0" text-anchor="start">FAN-OUT</text><text class="name" x="0.0" y="147.0" text-anchor="start">Locked input</text><circle class="dot" cx="1.6" cy="158.0" r="3.4"/><path class="flow" d="M91.2 158.0 H128.0"/><path class="rule" d="M132.0 86.0 V230.0"/><path class="flow" d="M132.0 86.0 H154.0" marker-end="url(#h)"/><text class="name" x="162.0" y="75.0" text-anchor="start">Independent branch A</text><circle class="dot" cx="163.6" cy="86.0" r="3.4"/><path class="flow" d="M132.0 158.0 H154.0" marker-end="url(#h)"/><text class="name" x="162.0" y="147.0" text-anchor="start">Independent branch B</text><circle class="dot" cx="163.6" cy="158.0" r="3.4"/><path class="flow" d="M132.0 230.0 H154.0" marker-end="url(#h)"/><text class="name" x="162.0" y="219.0" text-anchor="start">Independent branch C</text><circle class="dot" cx="163.6" cy="230.0" r="3.4"/><path class="flow" d="M306.5 86.0 H372.0"/><path class="flow" d="M306.5 158.0 H372.0"/><path class="flow" d="M306.5 230.0 H372.0"/><path class="rule" d="M372.0 86.0 V230.0"/><path class="flow" d="M372.0 158.0 H439.0" marker-end="url(#h)"/><path class="gate" d="M446 70 V246"/><text class="lane" x="446.0" y="60.0" text-anchor="middle">CHECKER</text><path class="flow" d="M446.0 158.0 H478.0"/><path class="rule" d="M478.0 108.0 V208.0"/><path class="flow" d="M478.0 108 H502.0" marker-end="url(#h)"/><path class="flow" d="M478.0 208 H502.0" marker-end="url(#h)"/><text class="name" x="508.0" y="97.0" text-anchor="start">Convergence</text><circle class="dot--ok" cx="509.6" cy="108.0" r="3.4"/><text class="note" x="508.0" y="78.0" text-anchor="start">validated outputs</text><text class="tag tag--ok" x="602.3" y="101.0">[ACCEPTED]</text><text class="name" x="508.0" y="197.0" text-anchor="start">Stop, route the finding</text><circle class="dot--bad" cx="509.6" cy="208.0" r="3.4"/><text class="note" x="508.0" y="178.0" text-anchor="start">missing or contradictory</text><text class="tag tag--bad" x="659.3" y="201.0">[HELD]</text><path class="rule rule--faint" d="M0.0 278.0 H880.0"/><text class="note note--foot" x="0.0" y="302.0" text-anchor="start">convergence consumes validated results or stops; it never repairs them</text></svg>
