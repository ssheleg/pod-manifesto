<svg class="figsvg" viewBox="0 0 880 400" role="img" aria-label="Invalidation is a routing decision, not a deletion" xmlns="http://www.w3.org/2000/svg"><defs><marker id="h" markerWidth="6" markerHeight="6" refX="5.2" refY="3" orient="auto"><path class="head" d="M0 0 L6 3 L0 6 z"/></marker></defs><text class="lane" x="0.0" y="32.0" text-anchor="start">THE SPINE</text><path class="rule" d="M8.0 56.0 V320.0"/><circle class="dot" cx="8.0" cy="70.0" r="3.4"/><text class="name" x="26.0" y="75.0" text-anchor="start">Accepted proof</text><circle class="dot" cx="8.0" cy="142.0" r="3.4"/><text class="name" x="26.0" y="147.0" text-anchor="start">Code, dependency, environment, or policy change</text><circle class="dot" cx="8.0" cy="214.0" r="3.4"/><text class="name" x="26.0" y="219.0" text-anchor="start">Map the change to covered claims</text><path class="flow" d="M8.0 262.0 H378.0" marker-end="url(#h)"/><text class="note" x="26.0" y="252.0" text-anchor="start">claim unaffected</text><path class="flow" d="M8.0 320.0 H378.0" marker-end="url(#h)"/><text class="note" x="26.0" y="310.0" text-anchor="start">claim affected</text><circle class="dot--ok" cx="392.0" cy="262.0" r="3.4"/><text class="name" x="410.0" y="267.0" text-anchor="start">Proof remains valid</text><text class="tag tag--ok" x="546.0" y="267.0">[STILL COVERED]</text><circle class="dot--key" cx="392.0" cy="320.0" r="3.4"/><text class="name name--key" x="410.0" y="325.0" text-anchor="start">Check owed</text><path class="flow" d="M499.6 320 H610.0"/><path class="rule" d="M610.0 292.0 V356.0"/><path class="flow" d="M610.0 292 H628.0" marker-end="url(#h)"/><path class="flow" d="M610.0 356 H628.0" marker-end="url(#h)"/><circle class="dot--ok" cx="636.0" cy="292.0" r="3.4"/><text class="name" x="654.0" y="297.0" text-anchor="start">New proof version</text><text class="note" x="654.0" y="276.0" text-anchor="start">passes</text><circle class="dot--bad" cx="636.0" cy="356.0" r="3.4"/><text class="name" x="654.0" y="361.0" text-anchor="start">Unproven state</text><text class="note" x="654.0" y="340.0" text-anchor="start">fails or cannot run</text><path class="rule rule--faint" d="M0.0 374.0 H880.0"/><text class="note note--foot" x="0.0" y="396.0" text-anchor="start">the old proof stays in the record; the change returns to the earliest uncovered node</text></svg>
