name: checks

# The document argues that a repeated check becomes a mechanism rather than
# another paragraph. These are that mechanism for this repository.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  parity:
    name: index.html carries the canonical text
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check-parity.py --verbose
      # an unclosed tag rendered fine in Chrome for several commits; error
      # recovery is not specified to agree between engines, so it is a check now
      - run: python3 tools/check-html.py

  links:
    name: every published reference resolves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # github.com answers anonymous blob requests with a 404 once it throttles,
      # so references are verified through the API — with the runner's token so
      # the check measures the reference and not the rate limit.
      - run: python3 tools/check-links.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

  pack:
    name: the page still looks like the pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check-pack.py
      - run: python3 tools/build-theme.py --check

  figures:
    name: figure geometry holds and the page is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build-figures.py --check
      - run: python3 tools/inline-figures.py --check
