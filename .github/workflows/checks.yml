name: checks

# The document argues that a repeated check becomes a mechanism rather than
# another paragraph. These are that mechanism for this repository.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  parity:
    name: index.html carries the canonical text
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check-parity.py --verbose
      # an unclosed tag rendered fine in Chrome for several commits; error
      # recovery is not specified to agree between engines, so it is a check now
      - run: python3 tools/check-html.py
      # a deploy shipped while browsers kept the previous stylesheet; asset URLs
      # carry a content hash now, and a stale stamp fails here rather than live
      - run: python3 tools/stamp-assets.py --check

  links:
    name: every published reference resolves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # github.com answers anonymous blob requests with a 404 once it throttles,
      # so references are verified through the API — with the runner's token so
      # the check measures the reference and not the rate limit.
      - run: python3 tools/check-links.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

  currency:
    name: every characterised citation is still current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A permalink resolves forever, so resolution is the wrong question asked alone.
      # This document asserted four requirements were "filed as open backlog rows" for two
      # days and six hours after the first of them closed: both permalinks resolved, the link
      # check above was green, and the receipt confirmed a belief that had stopped being
      # true — a worse failure than a dead link, because a reader who follows a dead link
      # knows to distrust it. Currency is a second property; this is its check.
      # The self-test runs first and offline: a guard nobody has watched fail is not evidence.
      - run: python3 tools/check-currency.py --self-test
      - run: python3 tools/check-currency.py --verbose
        env:
          GITHUB_TOKEN: ${{ github.token }}

  dates:
    name: every published date is the one git records
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # a date derived from the log needs the log
      - run: python3 tools/stamp-dates.py --check

  version:
    name: the stated version is the tag it claims to be
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # tags, and the log they hang on
      # The version is written in nine places, and CHANGELOG.md promises the
      # canonical text does not move without one. A reader is told to cite
      # `blob/v<version>/manifesto.md`; if the stated version and the newest tag
      # disagree, that address points at text which is not the text on the page.
      - run: python3 tools/check-version.py --verbose

  render:
    name: the rendered document carries the text
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Every other job here reads a file. All of them were green for four days
      # while the document printed 27 of its 30 pages blank: the sections sit at
      # opacity 0 until an observer marks them seen, and printing never scrolls.
      # A property nobody rendered is a property nobody checked. This job renders.
      # It also runs the contrast sweep, which used to be the one manual check —
      # it needs a browser, which is not the same as needing a person.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: python3 tools/check-render.py --verbose

  negatives:
    name: every gate refuses a planted defect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `manifesto.md:190`: a check must be shown able to discriminate failure from
      # success. Eight of the nine tools here had no negative control until this job
      # existed — they were trusted because they were green, which is the position this
      # document argues against, held by this document's own repository. The ninth,
      # `stamp-dates.py`, was still uncovered on 2026-08-23 while `README.md:75`
      # described this file as covering "every gate above". It is covered now.
      # The browser cases skip loudly without these, and a skip is not a pass.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: python3 tools/negatives.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

  pack:
    name: the page still looks like the pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check-pack.py

  figures:
    name: figure geometry holds and the page is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build-figures.py --check
      - run: python3 tools/inline-figures.py --check
