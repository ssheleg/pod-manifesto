name: live

# Every check in `checks.yml` reads the working tree, which leaves the one place
# a defect can appear after the last green: between the commit and the reader.
#
# Two were found by hand on 2026-08-23 and both had been live for days. The edge
# was serving a `robots.txt` that disallowed nine AI crawlers and set
# `Content-Signal: ai-train=no`, against a repository file 184 bytes long that
# says the machine reader is welcome — a Cloudflare managed-robots switch nobody
# had looked at, because no check looks at the published site. This job looks.
#
# It runs after the deploy rather than before it, which is why it is its own
# workflow: `pages build and deployment` is generated by GitHub and cannot be
# edited, so this hangs off its completion.

on:
  # `deployment_status`, not `workflow_run`. The first attempt hung this off
  # "pages build and deployment", which never fired once: `workflow_run` matches
  # workflows defined by a file in `.github/workflows/`, and the Pages workflow is
  # generated by GitHub and has no file here. A trigger that cannot fire is the
  # same shape of defect as a check that reads the wrong subject — it reports
  # nothing and looks configured. Pages records a deployment, so this listens for
  # the deployment instead, and runs only when that deployment succeeded.
  deployment_status:
  schedule:
    # A deploy is not the only way the published site changes. An edge setting
    # can be flipped in a dashboard with no commit anywhere, which is exactly
    # what happened, so the check also runs on its own clock.
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  live:
    name: the published site matches this repository
    runs-on: ubuntu-latest
    # A deployment that failed has nothing to check, and every deployment emits
    # several statuses on its way to one of them.
    if: >-
      github.event_name != 'deployment_status' ||
      github.event.deployment_status.state == 'success'
    steps:
      - uses: actions/checkout@v4

      # The rules that decide the robots comparison, run offline against planted
      # cases first. A guard nobody has watched fail is not evidence, and this one
      # is the guard for the defect that shipped.
      - run: python3 tools/check-live.py --self-test

      # GitHub Pages serves from an edge that can lag the deploy by a few seconds;
      # the byte comparison against the checkout is meaningless until it settles.
      - name: let the deploy settle
        if: github.event_name == 'deployment_status'
        run: sleep 45

      - run: python3 tools/check-live.py --verbose
